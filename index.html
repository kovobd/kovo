    <script>
      // Start the storefront data requests now, in parallel with the app bundle.
      // src/lib/publicApi.ts picks these promises up by URL.
      (function () {
        try {
          var edge = /(^|\.)kovobd\.com$|\.workers\.dev$/.test(location.hostname);
          var supa = "%VITE_SUPABASE_URL%", key = "%VITE_SUPABASE_PUBLISHABLE_KEY%";
          var v = null; try { v = localStorage.getItem("mvbd:storefrontVersion"); } catch (e) {}
          var store = (window.__kovoEarly = {});
          var go = function (fn) {
            var u = new URL(edge ? "/api/public/" + fn : supa + "/functions/v1/" + fn, location.origin);
            if (v) u.searchParams.set("v", v);
            var url = u.toString();
            store[url] = fetch(url, edge ? {} : { headers: { apikey: key, Authorization: "Bearer " + key } });
            store[url].catch(function () { delete store[url]; });
          };
          go("public-layout");
          if (location.pathname === "/") go("public-home");
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script>
      try {
        window.__app_booted__ = false;
        setTimeout(function() {
          if (window.__app_booted__) return;
          var r = document.getElementById("root");
          if (!r || r.hasChildNodes()) return;
          try {
            var k = "__app_boot_recovery__";
            var already = false;
            try { already = sessionStorage.getItem(k) === "1"; } catch(e) {}
            if (!already) {
              try { sessionStorage.setItem(k, "1"); } catch(e) {}
              location.reload();
              return;
            }
          } catch(e) {}
          r.style.cssText = "min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',system-ui,sans-serif;background:#FFFFFF;color:#121212;";
          r.innerHTML = '<div style="text-align:center;padding:24px;"><div style="font-size:15px;margin-bottom:12px;letter-spacing:0.25em;text-transform:uppercase;font-family:\'Jost\',sans-serif;color:#121212;">Loading Kovo…</div><button id="__boot_retry__" style="background:#121212;color:#FFFFFF;border:0;border-radius:2px;padding:12px 26px;font:inherit;font-weight:600;cursor:pointer;letter-spacing:0.12em;text-transform:uppercase;">Retry</button></div>';
          var btn = document.getElementById("__boot_retry__");
          if (btn) btn.onclick = function() {
            try { sessionStorage.removeItem("__app_boot_recovery__"); } catch(e) {}
            location.reload();
          };
        }, 12000);
      } catch(e) {}
    </script>
