name = "kovo"
compatibility_date = "2025-04-01"
main = "worker/index.ts"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
# The SPA shell ships as app.html (see scripts/prepare-worker-assets.mjs), so
# page URLs fall through to the Worker, which serves it with data inlined.
# Unknown files get a real 404 instead of the HTML shell.
not_found_handling = "none"
html_handling = "none"

[build]
# Server-side rendering bundle (src/entry-server.tsx → dist-ssr/), imported by
# the Worker, then the asset tweaks. Runs after the client `vite build`.
command = "npm run build:ssr && node scripts/prepare-worker-assets.mjs"

[vars]
VITE_SUPABASE_URL = "https://pyzjuxdznayzenxjpiea.supabase.co"
VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_8aDj4KLj16KX_zLKZOsnsw_9tOzFpCi"
VITE_SUPABASE_PROJECT_ID = "pyzjuxdznayzenxjpiea"
